name: Armar resumen de datos

# Arma data/resumen.json con todas las series ya recortadas, para que la web abra con un solo
# pedido. Cada hora, de 8 a 23 hs de Buenos Aires (UTC-3). No necesita claves.
# Si el archivo tiene mas de 3 horas (12 para las series mensuales), la web pide cada serie a su fuente.
on:
  schedule:
    - cron: "40 11-23 * * *"
    - cron: "40 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumen
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_resumen.py
      - name: Guardar cambios
        run: |
          git config user.name "econochanta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/resumen.json
          git diff --staged --quiet && exit 0
          git commit -m "Actualizar resumen de datos"
          git pull --rebase origin main
          git push
