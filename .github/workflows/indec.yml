name: Actualizar datos del INDEC

# Baja las series de la API oficial del INDEC (api.indec.gob.ar) y las guarda en data/indec.json.
# Necesita el secreto INDEC_TOKEN en Settings > Secrets and variables > Actions.
# Cada 2 horas en horario laboral de Buenos Aires (UTC-3), de lunes a viernes: el INDEC publica
# casi siempre a las 16 hs.
on:
  schedule:
    - cron: "15 12,14,16,18,19,20,21,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indec
  cancel-in-progress: false

jobs:
  indec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar series del INDEC
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: |
          if [ -z "$INDEC_TOKEN" ]; then echo "Falta el secreto INDEC_TOKEN; no se actualiza nada."; exit 0; fi
          python scripts/fetch_indec.py
      - name: Guardar cambios
        run: |
          git config user.name "econochanta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indec.json
          # "generado" cambia siempre; solo se publica si cambio algun dato. El archivo va en una sola
          # linea, asi que se compara el contenido (sin "generado") en vez de las lineas del diff.
          if git diff --staged --quiet; then exit 0; fi
          if python3 -c 'import json,subprocess,sys; n=json.load(open("data/indec.json",encoding="utf-8")); v=json.loads(subprocess.run(["git","show","HEAD:data/indec.json"],capture_output=True,text=True).stdout or "{}"); n.pop("generado",None); v.pop("generado",None); sys.exit(0 if n==v else 1)'; then git reset -q; echo "Sin datos nuevos."; exit 0; fi
          git commit -m "Actualizar datos del INDEC"
          git pull --rebase origin main
          git push
