name: Actualizar noticias

# Cada hora, de 6 a 23 hs de Buenos Aires (UTC-3).
on:
  schedule:
    - cron: "0 9-23 * * *"
    - cron: "0 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - name: Guardar cambios
        run: |
          git config user.name "econochanta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Actualizar noticias"
          git push
